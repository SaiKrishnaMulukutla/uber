# Use every available core (default is a single worker) and allow more concurrent
# connections per worker — the gateway, not the Go services, was the throughput ceiling.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/s;
    # High api-zone limit tuned for throughput load testing (see docs/LOAD_TEST.md).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20000r/s;

    # Keepalive upstream pools: reuse backend connections instead of opening a new
    # TCP connection per request (which exhausts connections under high concurrency).
    upstream user_up         { server ${USER_SERVICE_ADDR};         keepalive 64; }
    upstream driver_up       { server ${DRIVER_SERVICE_ADDR};       keepalive 64; }
    upstream trip_up         { server ${TRIP_SERVICE_ADDR};         keepalive 64; }
    upstream notification_up { server ${NOTIFICATION_SERVICE_ADDR}; keepalive 64; }
    upstream payment_up      { server ${PAYMENT_SERVICE_ADDR};      keepalive 64; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8000;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }

        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        # Reuse pooled keepalive connections to the upstreams.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        location ~ ^/users/(register|verify-register|login|refresh|forgot-password|reset-password)$ {
            limit_req zone=auth burst=30 nodelay;
            proxy_pass http://user_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/drivers/(register|verify-register|login|refresh|forgot-password|reset-password)$ {
            limit_req zone=auth burst=30 nodelay;
            proxy_pass http://driver_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /users/ {
            limit_req zone=api burst=20000 nodelay;
            proxy_pass http://user_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /drivers/ {
            limit_req zone=api burst=20000 nodelay;
            proxy_pass http://driver_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /trips/ {
            limit_req zone=api burst=20000 nodelay;
            proxy_pass http://trip_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass ${TRIP_SERVICE_URL};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /notifications/ {
            limit_req zone=api burst=20000 nodelay;
            proxy_pass http://notification_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /payments/ws/ {
            proxy_pass ${PAYMENT_SERVICE_URL};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /payments/ {
            limit_req zone=api burst=20000 nodelay;
            proxy_pass http://payment_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
